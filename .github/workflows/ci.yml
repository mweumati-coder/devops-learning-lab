name: CI

on:
  push:
    branches: [main]
    paths:
      - "01-docker-flask-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "01-docker-flask-app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  APP_DIR: 01-docker-flask-app

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: flake8 app tests --max-line-length 100

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: pytest -q

  docker:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    # Only publish from main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lab-app
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
