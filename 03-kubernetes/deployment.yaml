apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: lab
  labels:
    app: lab-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
        - name: lab-app
          # Replace YOUR_GITHUB_USERNAME with your GitHub username (lowercase),
          # or load a local image into kind: `kind load docker-image lab-app:1.0`
          image: ghcr.io/YOUR_GITHUB_USERNAME/lab-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: lab-app-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
